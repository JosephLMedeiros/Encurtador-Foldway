<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal dos Links (placeholder)</title>
  <style>
    :root { --bg: #0f1020; --card: #1a1b33; --text: #e8e8f5; --muted: #a0a0c0; --accent: #8b5cf6; --ok: #22c55e; --err: #f87171; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; } .muted { color: var(--muted); }
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin-top: 20px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; }
    input { flex: 1 1 220px; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #11122a; color: var(--text); }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: white; font-weight: 600; cursor: pointer; }
    #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 8px; border-bottom: 1px solid #2a2b4a; }
    a { color: #c4b5fd; } td.url { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
<main>
  <h1>Portal dos Links</h1>
  <p class="muted">Frontend <strong>placeholder</strong>: valida o fluxo frontend → API → banco. O frontend real (personagem e identidade) substitui esta pasta.</p>

  <section class="card">
    <h2>Abrir um portal</h2>
    <form id="create">
      <input name="original_url" type="url" placeholder="https://destino-muito-longo.com/..." required>
      <input name="custom_code" placeholder="código personalizado (opcional)">
      <button>Encurtar</button>
    </form>
    <p id="msg"></p>
  </section>

  <section class="card">
    <h2>Links</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Código</th><th>Destino</th><th>Cliques</th></tr></thead>
      <tbody id="links"></tbody>
    </table></div>
  </section>

  <section class="card">
    <h2>Link do dia (24h)</h2>
    <ol id="ranking"></ol>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>

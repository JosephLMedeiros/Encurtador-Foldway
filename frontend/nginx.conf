worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Upstream com o mesmo nome no docker-compose e no Kubernetes (Service "api", porta 8080).
  upstream kiro_api {
    server api:8080;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Probe do Kubernetes: só indica que o nginx está de pé.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # API e redirect dos links curtos: mesma origem, sem CORS.
    location /api/ {
      proxy_pass http://kiro_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /r/ {
      proxy_pass http://kiro_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer outra rota cai no index.html (pronto para um router no frontend real).
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

# Módulo oficial OpenTelemetry do nginx (imagem nginx:*-otel): o frontend vira um elo do trace.
load_module modules/ngx_otel_module.so;

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # trace_id no log de acesso: dá para achar o trace no Tempo a partir de uma linha de log
  log_format kiro '$remote_addr "$request" $status $body_bytes_sent ${request_time}s trace=$otel_trace_id';
  access_log /dev/stdout kiro;
  error_log /dev/stderr warn;

  # Traces: continua o traceparent vindo do navegador (ou inicia um) e propaga para a API.
  otel_exporter {
    endpoint otel-collector:4317;
  }
  otel_service_name kiro-frontend;
  otel_trace on;
  otel_trace_context propagate;
  otel_span_name "$request_method $uri";

  # Upstream com o mesmo nome no docker-compose e no Kubernetes (Service "api", porta 8080).
  upstream kiro_api {
    server api:8080;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Probe do Kubernetes: só indica que o nginx está de pé.
    location = /healthz {
      otel_trace off;
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # API e redirect dos links curtos: mesma origem, sem CORS.
    location /api/ {
      proxy_pass http://kiro_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Link inexistente (404) ou expirado (410): entrega o app, que mostra a tela do Furl
    # na mesma URL (rota /r/:code do React). O status HTTP original é mantido (D-12).
    location /r/ {
      proxy_pass http://kiro_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_intercept_errors on;
      error_page 404 410 /index.html;
    }

    # Spans do navegador -> Collector (OTLP/HTTP), pela mesma origem.
    location /otlp/ {
      otel_trace off;
      access_log off;
      client_max_body_size 1m;
      proxy_pass http://otel-collector:4318/;
    }

    # Assets do Vite têm hash no nome: podem ficar em cache para sempre.
    location /assets/ {
      otel_trace off;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer outra rota cai no index.html (React Router). Sem cache, para um
    # deploy novo aparecer no próximo carregamento.
    location / {
      otel_trace off;
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}

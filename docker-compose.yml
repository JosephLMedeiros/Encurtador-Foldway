# Ambiente local: mesmos nomes de serviço usados no Kubernetes (database, api).
# Uso: docker compose up --build
name: kiro-portal

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: encurtador
      POSTGRES_USER: kiro
      POSTGRES_PASSWORD: ${DB_PASSWORD:-troque-esta-senha}   # valor de exemplo: troque
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiro -d encurtador"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    image: kiro-api:dev
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: encurtador
      DB_USER: kiro
      DB_PASSWORD: ${DB_PASSWORD:-troque-esta-senha}
      BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:

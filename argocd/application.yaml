# Application do ArgoCD: o repositório é a fonte da verdade do namespace "encurtador".
# Instalação do ArgoCD + esta Application (uma única vez; depois disso, tudo chega pelo Git):
#   scripts/argocd-up.sh
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiro-portal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # apagar a Application remove os recursos do cluster
spec:
  project: default
  source:
    repoURL: https://github.com/JosephLMedeiros/rascunho-encurtador.git
    targetRevision: main
    path: k8s   # kustomization.yaml: app + stack de observabilidade
  destination:
    server: https://kubernetes.default.svc
    namespace: encurtador
  syncPolicy:
    automated:
      prune: true      # remove do cluster o que saiu do Git
      selfHeal: true   # desfaz alterações manuais no cluster
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

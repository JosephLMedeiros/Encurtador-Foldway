# Ponto de entrada do GitOps: o ArgoCD aplica `kubectl kustomize k8s/`.
# Validar localmente: kubectl kustomize k8s | kubectl apply --dry-run=client -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: encurtador
labels:
  - pairs:
      app.kubernetes.io/part-of: kiro-portal
    includeSelectors: false
resources:
  - base/namespace.yaml
  # - base/ingress.yaml   # habilite quando o cluster tiver um Ingress Controller (D-02)
  - database/secret.yaml
  - database/service.yaml
  - database/statefulset.yaml
  - api/configmap.yaml
  - api/deployment.yaml
  - api/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  # Observabilidade (D-09): OTel Collector -> Tempo (traces); Prometheus (métricas); Grafana
  - observability/otel-collector.yaml
  - observability/tempo.yaml
  - observability/prometheus.yaml
  - observability/grafana.yaml
# Configs geradas a partir de arquivos (os mesmos que o docker-compose monta).
# O sufixo de hash no nome faz o pod reiniciar sozinho quando a config muda no Git.
configMapGenerator:
  - name: otel-collector-config
    files: [observability/config/otel-collector.yaml]
  - name: tempo-config
    files: [observability/config/tempo.yaml]
  - name: prometheus-config
    files: [observability/config/prometheus.yaml]
  - name: grafana-datasources
    files: [observability/config/grafana-datasources.yaml]
  - name: grafana-dashboard-provider
    files: [observability/config/grafana-dashboards.yaml]
  - name: grafana-dashboards
    files: [observability/dashboards/kiro-portal.json]
# O CI (GitHub Actions) atualiza newTag com o SHA do commit a cada build na main.
# O ArgoCD detecta o commit e sincroniza o cluster (GitOps: Git é a fonte da verdade).
images:
  - name: ghcr.io/josephlmedeiros/rascunho-encurtador/api
    newTag: 652b3c7
    newName: ghcr.io/josephlmedeiros/rascunho-encurtador/api
  - name: ghcr.io/josephlmedeiros/rascunho-encurtador/frontend
    newTag: 652b3c7
    newName: ghcr.io/josephlmedeiros/rascunho-encurtador/frontend

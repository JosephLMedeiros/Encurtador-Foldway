# Prometheus no docker-compose: mesmo job/labels do Kubernetes, com alvo estático.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kiro-pods
    static_configs:
      - targets: ["api:8080"]
        labels:
          app: api
          pod: api-compose

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

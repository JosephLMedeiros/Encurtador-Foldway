apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false

  # Ranking "link do dia" vem direto do banco (alta cardinalidade não vai para o Prometheus).
  # DB_USER/DB_PASSWORD são injetados no container do Grafana a partir do Secret db-credentials.
  - name: Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    url: database:5432
    user: $DB_USER
    jsonData:
      database: encurtador
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $DB_PASSWORD

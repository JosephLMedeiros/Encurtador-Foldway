# =============================================================================
# ATENÇÃO: Este arquivo contém apenas a ESTRUTURA do Secret.
# NÃO contém credenciais reais. Os valores são placeholders.
# =============================================================================
#
# Como usar (opção recomendada — credenciais nunca vão para o Git):
#
#   kubectl create secret generic db-credentials \
#     --namespace encurtador \
#     --from-literal=DB_USER=<usuario> \
#     --from-literal=DB_PASSWORD=<senha> \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Alternativamente, copie este arquivo para secret.local.yaml (que está no
# .gitignore), preencha os valores em base64 e aplique com:
#   kubectl apply -f k8s/database/secret.local.yaml
#
# Encode base64: echo -n "minha-senha" | base64
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: encurtador
  labels:
    app: database
    app.kubernetes.io/component: database
type: Opaque
data:
  # Substitua pelos valores reais em base64 — NUNCA comite com valores reais
  DB_USER: PLACEHOLDER_BASE64
  DB_PASSWORD: PLACEHOLDER_BASE64

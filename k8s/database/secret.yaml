# =============================================================================
# VALORES DE EXEMPLO — TROQUE antes de usar fora da demo.
# =============================================================================
# Este Secret está no Git para que o ArgoCD consiga subir o ambiente da demo sozinho.
# Como o ArgoCD tem selfHeal, uma alteração manual seria revertida. Para usar uma senha real:
#   1. remova "database/secret.yaml" de k8s/kustomization.yaml;
#   2. crie o Secret fora do Git:
#        kubectl -n encurtador create secret generic db-credentials \
#          --from-literal=DB_USER=kiro --from-literal=DB_PASSWORD='<senha-forte>'
#   (ou use Sealed Secrets / External Secrets).
# Atenção: o Postgres só lê a senha na primeira inicialização do volume.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels:
    app: database
    app.kubernetes.io/component: database
type: Opaque
stringData:
  DB_USER: kiro
  DB_PASSWORD: troque-esta-senha

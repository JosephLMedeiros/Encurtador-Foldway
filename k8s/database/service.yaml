apiVersion: v1
kind: Service
metadata:
  name: database
  labels:
    app: database
    app.kubernetes.io/component: database
spec:
  # ClusterIP: o banco NUNCA é exposto fora do cluster.
  type: ClusterIP
  selector:
    app: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

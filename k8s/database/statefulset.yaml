apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: encurtador
  labels:
    app: database
    app.kubernetes.io/component: database
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: database
          # TODO: substituir pela imagem correta quando D-05 for confirmada
          # PostgreSQL: postgres:16-alpine
          # MySQL:      mysql:8.0
          # Redis:      redis:7-alpine
          image: postgres:16-alpine

          ports:
            - name: db
              # PostgreSQL: 5432 | MySQL: 3306 | Redis: 6379
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            # Diretório de dados do PostgreSQL — deve coincidir com o volumeMount
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

  # PVC para persistência dos dados durante o hackathon
  # Se o ambiente não suportar PVC, substituir volumeMounts por emptyDir (dados não persistidos)
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: encurtador
  labels:
    app: frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          # A tag é atualizada automaticamente pelo CI (GitHub Actions)
          image: ghcr.io/josephlmedeiros/rascunho-encurtador/frontend:IMAGE_TAG_PLACEHOLDER

          ports:
            - name: http
              # Porta padrão para servidores HTTP de frontend (nginx, serve etc.)
              # Alinhar com a equipe de frontend (spec 01)
              containerPort: 3000
              protocol: TCP

          env:
            # URL da API acessível pelo browser — ajustar conforme exposição (Q-01)
            # No Ingress: usar o host do Ingress. No NodePort: IP+porta do cluster.
            - name: NEXT_PUBLIC_API_URL
              value: "http://api.encurtador.svc.cluster.local"
              # TODO: substituir pelo endereço externo real após Q-01 confirmada

          # Readiness: só envia tráfego quando o frontend estiver disponível
          # Path a alinhar com a equipe de frontend — / ou /healthz são os mais comuns
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"

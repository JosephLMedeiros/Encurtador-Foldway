apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/component: frontend
spec:
  # ClusterIP + port-forward na demo; Ingress (k8s/base/ingress.yaml) quando houver controller.
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http

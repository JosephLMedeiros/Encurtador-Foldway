apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    app.kubernetes.io/component: api
spec:
  # replicas é gerenciado pelo HPA (k8s/api/hpa.yaml). Não defina aqui.
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/component: api
      annotations:
        # Coletado pelo Prometheus (kubernetes_sd, um alvo por pod)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # A tag é definida em k8s/kustomization.yaml (images) e atualizada pelo CI.
          image: ghcr.io/josephlmedeiros/rascunho-encurtador/api:latest
          ports:
            - name: http
              containerPort: 8080
          # Configuração não sensível: ConfigMap. Credenciais: Secret (nunca no ConfigMap).
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          # Startup: a API só abre a porta depois de conectar no banco e aplicar o schema.
          # Orçamento (2s x 60 = 120s) maior que a espera interna pelo banco (60s): se o banco
          # não vier, a própria API sai com erro em vez de ser morta no meio da migração.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          # Liveness: processo vivo (não consulta o banco, para não reiniciar a API se o banco cair).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: só recebe tráfego se o banco responder (SELECT 1 em até 2s).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

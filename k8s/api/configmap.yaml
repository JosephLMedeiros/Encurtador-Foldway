apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels:
    app: api
    app.kubernetes.io/component: api
data:
  # Banco: <service>.<namespace> resolvido pelo DNS do cluster (credenciais vêm do Secret db-credentials)
  DB_HOST: "database"
  DB_PORT: "5432"
  DB_NAME: "encurtador"
  DB_POOL_MAX: "10"

  # URL pública usada para montar short_url. Para a demo via port-forward do frontend:
  #   kubectl -n encurtador port-forward svc/frontend 3000:80
  # Troque pelo host real quando houver Ingress (D-02).
  BASE_URL: "http://localhost:3000"

  # Formato do código curto aleatório (D-06)
  SHORT_CODE_LENGTH: "7"

  # OpenTelemetry (contrato: docs/otel-metrics-spec.md)
  OTEL_SERVICE_NAME: "kiro-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  OTEL_PROPAGATORS: "tracecontext,baggage"
  OTEL_TRACES_SAMPLER: "parentbased_always_on"

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: encurtador
  labels:
    app: api
    app.kubernetes.io/component: api
spec:
  # ClusterIP = acesso apenas interno ao cluster.
  # O acesso externo é feito via Ingress (k8s/base/ingress.yaml).
  # Se não houver Ingress Controller, trocar para NodePort (Q-01).
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080

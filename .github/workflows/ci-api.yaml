name: CI — API

# Dispara em push para main quando há mudanças na API ou no próprio workflow
on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/ci-api.yaml"
  # Permite disparo manual para testes
  workflow_dispatch:

# Evita builds redundantes para o mesmo branch
concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  test:
    name: Testes da API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: substituir pelo setup correto quando D-03 (linguagem da API) for confirmada
      # Exemplos:
      #   Python:  actions/setup-python@v5  with: { python-version: "3.12" }
      #   Node.js: actions/setup-node@v4    with: { node-version: "20" }
      #   Go:      actions/setup-go@v5      with: { go-version: "1.22" }
      - name: Setup do ambiente (placeholder)
        run: |
          echo "Substituir pelo setup da linguagem da API (D-03)"

      # TODO: substituir pelo comando de instalação de dependências correto
      # pip install -r requirements.txt | npm ci | go mod download
      - name: Instalar dependências (placeholder)
        run: |
          echo "Substituir pelo comando de instalação de dependências"

      # TODO: substituir pelo comando de execução de testes correto
      # pytest | npm test | go test ./...
      # IMPORTANTE: este step deve falhar se os testes falharem.
      - name: Executar testes
        run: |
          echo "Placeholder — substituir pelo comando de testes real"

  build-and-push:
    name: Build e Push da imagem
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login no Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # Para Docker Hub, use em vez do acima:
          # username: ${{ secrets.REGISTRY_USER }}
          # password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-manifest:
    name: Atualizar tag no manifesto Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar yq
        uses: mikefarah/yq@v4.44.3

      - name: Atualizar tag da imagem no Deployment
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          FULL_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          echo "Atualizando imagem para: ${FULL_TAG}"
          yq e '.spec.template.spec.containers[0].image = "'${FULL_TAG}'"' \
            -i k8s/api/deployment.yaml
          echo "Conteúdo atualizado:"
          grep "image:" k8s/api/deployment.yaml

      - name: Commit e push da atualização
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/api/deployment.yaml
          git diff --staged --quiet || git commit -m \
            "chore(k8s): update api image to sha-$(echo '${{ github.sha }}' | cut -c1-7) [skip ci]"
          git push
